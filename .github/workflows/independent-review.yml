name: Independent findings review

on:
  push:
    branches:
      - fix/findings-independent-review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: independent-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run test suite
        run: uv run pytest -q
