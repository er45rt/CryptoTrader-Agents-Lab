[project]
name = "crypto_trader"
version = "0.1.0"
description = "crypto_trader using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "crewai[tools]>=0.120.1,<1.0.0",
    "requests>=2.33.0,<3",
    "urllib3==2.8.0",
    "protobuf==5.29.6",
    "python-dotenv>=1.0.0",
    "nautilus_trader==1.231.0"
]

# Development/test tooling. Kept in a uv dependency group so it is recorded in
# uv.lock and installable with `uv sync --group dev`, without changing runtime deps.
[dependency-groups]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
crypto_trader = "crypto_trader.main:run"
run_crew = "crypto_trader.main:run"
train = "crypto_trader.main:train"
replay = "crypto_trader.main:replay"
test = "crypto_trader.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.pytest.ini_options]
testpaths = ["src/crypto_trader/tests"]
pythonpath = ["src"]
markers = [
    "testnet: live Binance SPOT TESTNET integration tests (opt-in; skipped by default)",
    "mainnet_readonly: live Binance MAINNET read-only dry-run validation (opt-in; skipped by default)",
]
