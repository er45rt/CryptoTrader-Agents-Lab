<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>محرك CryptoTrader</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="layout">
  <nav class="side">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg></div>
      <div><b>CryptoTrader</b><small>محرك الاستراتيجيات</small></div>
    </div>
    <div class="sect">نظرة عامة</div>
    <a data-page="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>الرئيسية</a>
    <a data-page="demo"><svg viewBox="0 0 24 24"><path d="M5 4l14 8-14 8V4z"/></svg>الوضع التجريبي</a>
    <div class="sect">التداول</div>
    <a data-page="strategies"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>الاستراتيجيات</a>
    <a data-page="backtest"><svg viewBox="0 0 24 24"><path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 16v-5"/><path d="M12 16V8"/><path d="M16 16v-3"/></svg>الاختبار التاريخي</a>
    <a data-page="paper"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4V8z"/></svg>التداول الورقي</a>
    <a data-page="decisions"><svg viewBox="0 0 24 24"><path d="M4 6h10"/><path d="M4 12h7"/><path d="M4 18h10"/><circle cx="18" cy="9" r="3"/><path d="M18 12v6"/></svg>مركز القرارات</a>
    <div class="sect">التحكم</div>
    <a data-page="risk"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/></svg>المخاطر والإعدادات</a>
    <a data-page="logs"><svg viewBox="0 0 24 24"><path d="M8 6h12"/><path d="M8 12h12"/><path d="M8 18h12"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/></svg>السجلات</a>
    <a data-page="system"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>حالة النظام</a>
    <div class="side-foot">
      <button class="theme" id="theme-btn" type="button"><span>المظهر</span><span id="theme-name">داكن</span></button>
      <div class="live-off" id="live-badge"><i></i>التداول الحقيقي: معطّل</div>
      <div class="clock" id="clock"></div>
    </div>
  </nav>
  <main id="main"><div class="skel"></div></main>
</div>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
<script src="/decisions.js"></script>
<script src="/demo.js"></script>
</body>
</html>
